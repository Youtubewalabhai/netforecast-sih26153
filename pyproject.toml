[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netforecast"
version = "0.1.0"
description = "AI based Network Attack Forecasting from Network Traffic Data (SIH26153)"
readme = "README.md"
authors = [{ name = "Team CHECK_MATE" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "torch>=2.0.0",
    "scapy>=2.5.0",
    "shap>=0.45.0",
    "pyyaml>=6.0.0",
    "joblib>=1.3.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
