project:
  name: "netforecast"
  problem_statement: "SIH26153 - AI based Network Attack Forecasting from Network Traffic Data"
  team: "CHECK_MATE"
  seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  dataset_type: "cic_ids_2018" # options: cic_ids_2018, ctu_13
  selected_files:
    - "02-14-2018.csv" # Benign + FTP-BruteForce, SSH-Bruteforce
    - "02-15-2018.csv" # Benign + DoS-GoldenEye, DoS-Slowloris
    - "02-28-2018.csv" # Benign + Infiltration
  benign_subsample_ratio: 0.1 # Subsample benign flows to speed up CPU training
  time_window_seconds: 10 # Aggregate state vector S_t resolution (seconds)
  holdout_attack: "Infiltration" # For zero-shot / attack generalization test

features:
  flow_numeric_cols:
    - "Dst Port"
    - "Protocol"
    - "Flow Duration"
    - "Tot Fwd Pkts"
    - "Tot Bwd Pkts"
    - "TotLen Fwd Pkts"
    - "TotLen Bwd Pkts"
    - "Fwd Pkt Len Max"
    - "Fwd Pkt Len Min"
    - "Fwd Pkt Len Mean"
    - "Fwd Pkt Len Std"
    - "Bwd Pkt Len Max"
    - "Bwd Pkt Len Min"
    - "Bwd Pkt Len Mean"
    - "Bwd Pkt Len Std"
    - "Flow Byts/s"
    - "Flow Pkts/s"
    - "Flow IAT Mean"
    - "Flow IAT Std"
    - "Flow IAT Max"
    - "Flow IAT Min"
    - "Fwd IAT Tot"
    - "Fwd IAT Mean"
    - "Fwd IAT Std"
    - "Fwd IAT Max"
    - "Fwd IAT Min"
    - "Bwd IAT Tot"
    - "Bwd IAT Mean"
    - "Bwd IAT Std"
    - "Bwd IAT Max"
    - "Bwd IAT Min"
    - "Fwd PSH Flags"
    - "Bwd PSH Flags"
    - "Fwd URG Flags"
    - "Bwd URG Flags"
    - "Fwd Header Len"
    - "Bwd Header Len"
    - "Fwd Pkts/s"
    - "Bwd Pkts/s"
    - "Pkt Len Min"
    - "Pkt Len Max"
    - "Pkt Len Mean"
    - "Pkt Len Std"
    - "Pkt Len Var"
    - "FIN Flag Cnt"
    - "SYN Flag Cnt"
    - "RST Flag Cnt"
    - "PSH Flag Cnt"
    - "ACK Flag Cnt"
    - "URG Flag Cnt"
    - "CWE Flag Count"
    - "ECE Flag Cnt"
    - "Down/Up Ratio"
    - "Pkt Size Avg"
    - "Fwd Seg Size Avg"
    - "Bwd Seg Size Avg"
    - "Subflow Fwd Pkts"
    - "Subflow Fwd Byts"
    - "Subflow Bwd Pkts"
    - "Subflow Bwd Byts"
