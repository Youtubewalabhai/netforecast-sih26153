stages:
  0: "Benign"
  1: "Reconnaissance"
  2: "Initial Access"
  3: "Lateral Movement"
  4: "Command and Control"
  5: "Exfiltration/Impact"

model:
  type: "lstm" # options: "lstm", "transformer"
  input_dim: 72 # Updated dynamically from state vector S_t size
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  seq_len: 12 # Input history length (12 windows = 120s if window=10s)
  k_rollout: 5 # Number of future steps to forecast
  loss_weights:
    dynamics: 1.0 # Next-state MSE loss
    infiltration: 2.0 # Infiltration BCE loss
    stage: 1.5 # MITRE Stage CrossEntropy loss
  learning_rate: 0.001
  batch_size: 64
  epochs: 15
  device: "cpu"

training:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

paths:
  model_save: "models/world_model.pt"
  scaler_save: "models/scaler.joblib"
  baseline_save: "models/baseline.joblib"
  metrics_json: "results/metrics.json"
  metrics_md: "results/metrics.md"
  plots_dir: "results/plots"
